<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flipbook Manjau</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
        font-family: system-ui, sans-serif;
      }

      #book {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      #fallback {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: rgba(17, 17, 17, 0.92);
        color: #f5f5f5;
        text-align: center;
      }

      #fallback.is-visible {
        display: flex;
      }

      #fallback p {
        margin: 0 0 1rem;
        max-width: 28rem;
        line-height: 1.45;
      }

      #fallback a {
        display: inline-block;
        padding: 0.75rem 1.25rem;
        border-radius: 0.375rem;
        background: #f5f5f5;
        color: #111;
        text-decoration: none;
        font-weight: 600;
      }

      #fallback a:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <iframe
      id="book"
      title="Laporan BPHN — bookcase VSPFE"
      src="https://laporan.bphn.go.id/bookcase/vspfe"
      allowfullscreen
    ></iframe>

    <div id="fallback" role="dialog" aria-live="polite" aria-label="Embed tidak tersedia">
      <div>
        <p>
          Flipbook tidak bisa ditampilkan di halaman ini (kemungkinan situs BPHN
          memblokir embed). Buka langsung di tab baru:
        </p>
        <a
          href="https://laporan.bphn.go.id/bookcase/vspfe"
          target="_blank"
          rel="noopener noreferrer"
          >Buka di tab baru</a
        >
      </div>
    </div>

    <script>
      (function () {
        var FALLBACK_MS = 3000;
        var book = document.getElementById("book");
        var fallback = document.getElementById("fallback");
        var settled = false;
        var loaded = false;

        function showFallback() {
          if (settled) return;
          settled = true;
          fallback.classList.add("is-visible");
        }

        book.addEventListener("error", showFallback);
        book.addEventListener("load", function () {
          loaded = true;
        });

        window.setTimeout(function () {
          if (!loaded) showFallback();
        }, FALLBACK_MS);
      })();
    </script>
  </body>
</html>
